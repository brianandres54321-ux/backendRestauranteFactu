spring.application.name=backend_factu

# CONEXIÓN A SUPABASE (PRODUCCIÓN VÍA VARIABLES DE ENTORNO)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}?sslmode=require&prepareThreshold=0&tcpKeepAlive=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Configuración Mercado Pago
mercadopago.access-token=${MERCADOPAGO_TOKEN}

# Optimización de velocidad
spring.jpa.properties.javax.persistence.validation.mode=none
server.max-http-request-header-size=40KB