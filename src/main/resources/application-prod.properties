# ===========================
# BASE DE DATOS SUPABASE
# ===========================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:6543/${DB_NAME}?sslmode=require&prepareThreshold=0&tcpKeepAlive=true&stringtype=unspecified
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===========================
# JPA / HIBERNATE
# ===========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# ===========================
# JWT
# ===========================
jwt.secret=${JWT_SECRET}

# ===========================
# MERCADO PAGO
# ===========================
mercadopago.access-token=${MERCADOPAGO_TOKEN}

# ===========================
# OPTIMIZACIONES
# ===========================
spring.jpa.properties.javax.persistence.validation.mode=none
server.max-http-request-header-size=40KB